<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapAI</title>
<style>
body{margin:0;background:#070914;color:#f7f8ff;font-family:Arial,sans-serif}header{padding:20px 7%;border-bottom:1px solid #242943;font-size:24px;font-weight:bold}header span,h1 span{color:#8b7cff}main{max-width:850px;margin:auto;padding:70px 22px;text-align:center}.tag{display:inline-block;padding:8px 14px;border:1px solid #353a5b;border-radius:30px;color:#aeb5d3}h1{font-size:clamp(45px,9vw,78px);margin:22px 0 12px}p{color:#aeb4cc;font-size:18px;line-height:1.6}.card{margin:35px auto;padding:22px;background:#101426;border:1px solid #292f4b;border-radius:22px;text-align:left}textarea{width:100%;height:130px;background:#080b17;color:white;border:1px solid #303652;border-radius:14px;padding:15px;font-size:16px;box-sizing:border-box}button{margin-top:13px;padding:13px 20px;border:0;border-radius:12px;font-weight:bold;background:linear-gradient(90deg,#55d8ff,#8b7cff);cursor:pointer}#out{display:none;margin-top:16px;padding:15px;background:#080b17;border-radius:12px;color:#cdd3e8}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:45px}.feature{padding:20px;background:#0e1221;border:1px solid #242a43;border-radius:16px;text-align:left}@media(max-width:650px){.features{grid-template-columns:1fr}}
</style></head>
<body><header>Snap<span>AI</span></header>
<main><div class="tag">Your smart AI workspace</div><h1>Create with <span>SnapAI.</span></h1>
<p>Turn an idea, question, or piece of content into something useful with a simple AI workspace.</p>
<div class="card"><textarea id="p" placeholder="Tell SnapAI what you want help with..."></textarea><button onclick="go()">✨ Try SnapAI</button><div id="out"></div></div>
<div class="features"><div class="feature"><b>⚡ Fast</b><p>Get from idea to result quickly.</p></div><div class="feature"><b>🧠 Smart</b><p>Ready for a secure AI service connection.</p></div><div class="feature"><b>📱 Anywhere</b><p>Designed for phones, tablets and computers.</p></div></div></main>
<script>function go(){let p=document.getElementById('p').value.trim(),o=document.getElementById('out');o.style.display='block';o.textContent=p?'Demo response: SnapAI received your request. A real AI response will appear here after the secure AI API is connected.':'Type something first.'}</script></body></html>
